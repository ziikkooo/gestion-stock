<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ heading }} | Stock Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"></head>
<body class="auth-page"><main class="auth-card"><div class="auth-brand">STOCK MANAGER</div><h1>{{ heading }}</h1><p class="subtitle">{{ message }}</p><a class="btn" href="{{ url_for('home') if current_user.is_authenticated else url_for('login') }}">{{ 'Return home' if current_user.is_authenticated else 'Return to sign in' }}</a></main></body>
</html>
